<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>慢慢说英语</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">Aa</div><div><div class="brand-name">慢慢说英语</div><div class="brand-sub">每天一点点，开口更自在</div></div></div>
      <button class="icon-btn" id="sound-toggle" aria-label="切换发音">🔊</button>
    </header>

    <main>
      <section id="home-screen" class="screen active">
        <div class="welcome"><div class="eyebrow">今天想学点什么？</div><h1>选一个场景，<br><span>轻松开始。</span></h1><p>不用赶进度，按自己的节奏来。</p></div>
        <div class="section-head"><h2>学习场景</h2><span>随时可以更换</span></div>
        <div class="scene-grid" id="scene-grid"></div>
        <div class="section-head level-head"><h2>学习难度</h2><span>觉得难就调简单</span></div>
        <div class="level-switch" id="level-switch"></div>
        <div class="today-card"><div class="today-icon">☀️</div><div class="today-copy"><strong id="unit-title">准备好开始了吗？</strong><span id="unit-summary">每单元先学单词，再练短句和小测。</span></div><span class="today-arrow">›</span></div>
        <button class="primary-btn" id="start-btn">开始今天的学习 <span>→</span></button>
        <div class="stats-row"><div class="stat"><strong id="stat-units">0</strong><span>完成单元</span></div><div class="stat"><strong id="stat-words">0</strong><span>学过单词</span></div><button class="mistakes-link" id="open-mistakes">错题集 <span id="mistake-count">0</span>　›</button></div>
      </section>

      <section id="learn-screen" class="screen">
        <div class="learn-top"><button class="back-btn" id="back-home">‹ 返回</button><div class="unit-label" id="learn-unit-label"></div><button class="small-link" id="exit-learn">退出</button></div>
        <div class="progress-track"><div id="progress-fill"></div></div>
        <div id="learning-content"></div>
      </section>
    </main>
    <footer>慢慢来，记住一个就很棒。</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
